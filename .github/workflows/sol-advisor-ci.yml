name: Sol Advisor CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sol-advisor-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run repository verification
        run: sh plugins/sol-advisor/scripts/verify.sh
